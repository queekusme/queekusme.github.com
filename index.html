---
layout: null
---

<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="X-Clacks-Overhead" content="GNU Terry Pratchett" />
        <title>queekus.com</title>
        <link rel="me" href="https://mastodon.scot/@queekusme"></link>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
        <link href="css/sticker.css" rel="stylesheet">
        <link href="css/index.css" rel="stylesheet">
    </head>
    <body id="root">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container justify-content-md-between justify-content-center">
                <span class="navbar-brand">queekus.com</span>
                <a href="no-ai.txt" class="sticker d-flex align-items-center" role="alert">
                    Created by a human without AI&nbsp;&nbsp;<span class="fa fa-external-link"></span>
                </a>
            </div>
        </nav>
        <div class="container">
            <div class="row">{% for card in site.data.cards %}
                <a href="{{ card.href }}" target="_blank" class="card">
                    <img src="{{ card.img }}" class="card-img-top queekus-card-image" alt="{{ card.img-alt }}">
                    <div class="card-body">
                        <h5 class="card-title">{{ card.title }}</h5>
                        <p class="card-text">{{ card.text }}</p>
                    </div>
                </a>{% endfor %}
            </div>
            &nbsp;
            <div>
                <p>&copy; Annabelle Kennedy</p>
                <p class="snowflakes">Snowflakes by https://pajasevi.github.io/CSSnowflakes/</p>
            </div>
        </div>
        <div class="snowflakes" aria-hidden="true">
            <div class="snowflake"><i class="fa-solid fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-regular fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-solid fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-regular fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-solid fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-regular fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-solid fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-regular fa-snowflake"></i> </div>
            <div class="snowflake"><i class="fa-solid fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-regular fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-solid fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-regular fa-snowflake"></i></div>
            <div class="snowflake"><i class="fa-solid fa-snowflake"></i></div>
          </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
        <script>
            const month = new Date(Date.now()).getMonth();
            const day = new Date(Date.now()).getDate();

            if(![10, 11, 0].includes(month)) // November, december and January
                document.querySelectorAll('.snowflakes').forEach(e => e.remove());

            if(month === 3 && day === 1) // 1st April
                document.getElementById("root").className = "april_fools";
        </script>
    </body>
</html>
