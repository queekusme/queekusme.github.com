---
layout: default
---
<div class="jumbotron">
    <div class="row">
        <div class="col">
            <h1 class="display-4">{{page.project_name}} </h1>
            <p class="lead">{{ page.abstract }}</p>
        </div>
        {% if page.photos %}
        <div class="col">
            <div class="row">
                {% for image in page.photos %}
                <div class="col">
                    <div
                        class="project_thumbnail"
                        style="background-image: url('{{ image }}')"
                        onclick="OpenImageModal('{{ image }}')"
                    >
                        <i class="fa fa-magnifying-glass project_thumbnail_icon"></i>
                    </div>
                </div>
                {% endfor %}
            </div>
        </div>
        {% endif %}
    </div>
</div>
&nbsp;
{{ content }}
&nbsp;
{% if page.links %}
<h4></h4>
<ul class="list-group list-group-flush">
{% for link in page.links %}
  <a href="{{link}}" class="list-group-item list-group-item-action project-link">{{link}}</a>
{% endfor %}
</ul>
{% endif %}

<div class="modal fade" id="image_preview_modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <img class = "project_image" id="modal_image" src="{{ image }}" />
            </div>
        </div>
    </div>
</div>

<script>
    function OpenImageModal(image)
    {
        document.getElementById("modal_image").src = image;
        new bootstrap.Modal('#image_preview_modal').show();
    }
</script>
