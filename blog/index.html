<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="favicon.ico" />
        <link rel="alternate" type="application/rss+xml" href="https://queekus.com/rss.xml" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>queekus.com</title>
        <link rel="me" href="https://mastodon.scot/@queekusme"></link>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <span class="navbar-brand">queekus.com</span>
            </div>
        </nav>
        <div class="container">
            <div class="row" style="margin-top: 2vh;">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title" id="blog_title">Card title</h5>
                        <p class="card-text" id="blog_text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
                    </div>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            function urlParam(){ var kv = []; location.search.replace("?", "").split("&").forEach((pair) => { var kvPair = pair.split("="); kv[kvPair[0]] = kvPair[1]; } ); return kv; }

            window.addEventListener('load', async () =>
            {
                const page = urlParam().page ?? "404";
                const pathName = location.pathname.split("/");
                pathName.pop();
                const content = await fetch(`${pathName.join("/")}/${page}.txt`);

                const title = document.getElementById("blog_title");
                const text = document.getElementById("blog_text");

                title.innerHTML = page;
                text.innerHTML = (await content.text()).replace("\n", "<br/>");
            });

        </script>
    </body>
</html>
