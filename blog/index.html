<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="../favicon.ico" />
        <link rel="alternate" type="application/rss+xml" href="https://queekus.com/rss.xml" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta http-equiv="X-Clacks-Overhead" content="GNU Terry Pratchett" />
        <title>queekus.com Blog</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet" />
        <style>
            .blog-capitalise
            {
                text-transform: capitalize
            }
            .a-disabled {
                pointer-events: none;
            }
            .list-group-chain
            {
                max-height: calc(41.25px * 6);
                margin-bottom: 10px;
                overflow-y: scroll;
                -webkit-overflow-scrolling: touch;
                border-top-left-radius: 0px;
                border-top-right-radius: 0px;
            }
        </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <span class="navbar-brand">queekus.com Blog</span>
            </div>
        </nav>
        <div class="container">
            <div class="row" style="margin-top: 2vh;">
                <div class="card" id="blog_card">
                    <div class="card-body row">
                        <div id="main_content">
                            <div class="d-none d-md-block d-lg-block d-xl-block">
                                <div class="col-4 float-end ms-1 mb-1 chain">
                                    <!-- chain dynamically added -->
                                </div>
                            </div>
                            <h5 class="card-title blog-capitalise" id="blog_title">Card title</h5>
                            <h6 class="card-subtitle mb-2 text-body-secondary" id="blog_published">
                                Published Time Goes Here!</h5>
                            <h6 class="card-subtitle mb-2 text-body-secondary" id="blog_author">Author Goes Here!</h5>
                            <div class="d-block d-md-none d-lg-none d-xl-none chain">
                                <!-- chain dynamically added -->
                            </div>
                            <p class="card-text" id="blog_text">Some quick example text to build on the card title and make
                                up the bulk of the card's content.</p>
                        </div>
                    </div>
                </div>
            </div>
            &nbsp;
            <div>
                <p>&copy; Annabelle Kennedy</p>
        </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            function urlParam(){ var kv = []; location.search.replace("?", "").split("&").forEach((pair) => {
                    var kvPair = pair.split("="); kv[kvPair[0]] = kvPair[1]; } ); return kv; }

            function generateTagRegex(tag, groups, incNewline)
            {
                const group = "\~([^\<]+)";
                let accGroups = "";

                for(let i = 0; i < (groups ?? 1); i++) accGroups += group;

                return RegExp(`\>${tag}${accGroups}\<${incNewline ? "\\n" : ""}`, "gi")
            }

            function handleReplace(content)
            {
                let processed = content;

                processed = processed.replaceAll(generateTagRegex("image"), "<img class=\"img-fluid\" src=\"$1\" />");
                processed = processed.replaceAll(generateTagRegex("meta", 1, true), "");
                processed = processed.replaceAll(generateTagRegex("href", 2),
                    "<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"$2\">$1</a>");
                processed = processed.replaceAll("\n", "<br/>");

                return processed;
            }

            async function checkLink(path)// : [boolean, Response]
            {
                const pathName = location.pathname.split("/");
                pathName.pop();
                const content = await fetch(`${pathName.join("/")}/${path}`);

                return [content.status, content];
            }

            function createFontawesome(icon)
            {
                const fa = document.createElement("i");
                fa.classList.add("fa-solid", icon, "float-end", "m-1");

                return fa;
            }

            function buildChain(chainToAddTo)
            {
                const lgTitle = document.createElement("div");
                lgTitle.classList.add("list-group");

                const lgTitleItem = document.createElement("div");
                lgTitleItem.classList.add("list-group-item", "list-group-item-primary");
                lgTitleItem.appendChild(document.createTextNode("Other posts in this series:"));

                lgTitle.appendChild(lgTitleItem);
                lgTitle.appendChild(document.createElement("span")); // Formatting Fixer

                const lgChain = document.createElement("div");
                lgChain.classList.add("chain_content", "list-group", "list-group-chain", "list-group-numbered");
                lgChain.appendChild(document.createElement("span")); // Formatting Fixer

                chainToAddTo.appendChild(lgTitle);
                chainToAddTo.appendChild(lgChain);
            }

            function getMetadataFromContent(contentText)
            {
                let meta = generateTagRegex("meta", true).exec(contentText);
                if(meta !== null) meta = meta[1];
                if(meta !== undefined) meta = JSON.parse(meta);

                return meta;
            }

            const display = async (forcedPage) =>
            {
                const page = forcedPage ?? "404";
                const [status, content] = await checkLink(`${page}.txt`);

                if(status !== 200)
                    return display("404");

                const contentText = await content.text();
                const meta = getMetadataFromContent(contentText);

                document.getElementById("blog_title").innerHTML = page.replaceAll("-", " ");
                document.getElementById("blog_published").innerHTML
                    = meta?.published ? new Date(meta.published).toUTCString() : "";
                document.getElementById("blog_author").innerHTML = `Written By: ${meta?.author ?? "Admin"}`;
                document.getElementById("blog_text").innerHTML = handleReplace(contentText);

                if(meta?.chain)
                {
                    (async () =>
                    {
                        const [status, chainContent] = await checkLink(`${meta.chain}.chain`);

                        if(status !== 200)
                            return;

                        Array.from(document.getElementsByClassName("chain")).forEach(c => buildChain(c));;

                        const chainText = await chainContent.text();
                        const chainList = chainText.split("\n");

                        let target = [];

                        for(const item of chainList)
                        {
                            const [status, checkContent] = await checkLink(`${item}.txt`);
                            const checkMeta = getMetadataFromContent(await checkContent.text());

                            if((new Date(checkMeta?.published ?? 0)).getTime() > Date.now())
                                continue; // hide from chain

                            createLink = () =>
                            {
                                const chainLink = document.createElement("a");
                                chainLink.setAttribute("href", `?post=${item}`);
                                chainLink.setAttribute("target", "_blank");
                                chainLink.setAttribute("rel", "noopener noreferrer");
                                chainLink.classList.add("blog-capitalise", "list-group-item", "list-group-item-action");

                                if(status !== 200)
                                {
                                    disableLink(chainLink, "list-group-item-danger");
                                    chainLink.appendChild(createFontawesome("fa-link-slash"));
                                }

                                if(item === page)
                                {
                                    disableLink(chainLink, "list-group-item-dark");
                                    chainLink.appendChild(createFontawesome("fa-location-dot"));
                                    target.push(chainLink);

                                }

                                chainLink.appendChild(document.createTextNode(item.replaceAll("-", " ")));

                                return chainLink;
                            }

                            Array.from(document.getElementsByClassName("chain_content")).forEach(c => c.appendChild(createLink()));

                            target.forEach(t => t.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'start' }))
                        }
                    })()
                }

                function disableLink(link, className)
                {
                    link.setAttribute("href", `javascript:void(0)`);
                    link.classList.add(className, "a-disabled");
                }
            }

            window.addEventListener('load', () => display(urlParam().post));

        </script>
    </body>
</html>
