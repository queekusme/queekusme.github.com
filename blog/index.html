<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="favicon.ico" />
        <link rel="alternate" type="application/rss+xml" href="https://queekus.com/rss.xml" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>queekus.com</title>
        <link rel="me" href="https://mastodon.scot/@queekusme"></link>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <span class="navbar-brand">queekus.com</span>
            </div>
        </nav>
        <div class="container">
            <div class="row" style="margin-top: 2vh;">
                <div class="card" id="blog_card">
                    <div class="card-body">
                        <h5 class="card-title" id="blog_title" style="text-transform: capitalize">Card title</h5>
                        <h6 class="card-subtitle mb-2 text-body-secondary" id="blog_published">Published Time Goes Here!</h5>
                        <h6 class="card-subtitle mb-2 text-body-secondary" id="blog_author">Author Goes Here!</h5>
                        <p class="card-text" id="blog_text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
                    </div>
                </div>
            </div>
            &nbsp;
            <div>
                <p>&copy; Annabelle Kennedy</p>
        </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            function urlParam(){ var kv = []; location.search.replace("?", "").split("&").forEach((pair) => { var kvPair = pair.split("="); kv[kvPair[0]] = kvPair[1]; } ); return kv; }

            function generateTagRegex(tag, groups, incNewline)
            {
                const group = "\~(.+)";
                let accGroups = "";

                for(let i = 0; i < (groups ?? 1); i++) accGroups += group;

                return RegExp(`\>${tag}${accGroups}\<${incNewline ? "\\n" : ""}`, "gi")
            }

            function handleReplace(content)
            {
                let processed = content;

                processed = processed.replaceAll(generateTagRegex("image"), "<img class=\"img-fluid\" src=\"$1\" />");
                processed = processed.replaceAll(generateTagRegex("meta", 1, true), "");
                processed = processed.replaceAll(generateTagRegex("href", 2), "<a target=\"_blank\" rel=\"noopener noreferrer\" href=\"$2\">$1</a>");
                processed = processed.replaceAll("\n", "<br/>");

                return processed;
            }

            const display = async (forcedPage) =>
            {
                const page = forcedPage ?? "404";
                const pathName = location.pathname.split("/");
                pathName.pop();
                const content = await fetch(`${pathName.join("/")}/${page}.txt`);

                if(content.status !== 200)
                    return display("404");

                const contentText = await content.text();
                let meta = generateTagRegex("meta", true).exec(contentText);
                if(meta !== null) meta = meta[1];
                if(meta !== undefined) meta = JSON.parse(meta);

                document.getElementById("blog_title").innerHTML = page.replaceAll("-", " ");
                document.getElementById("blog_published").innerHTML = meta?.published ? new Date(meta.published).toUTCString() : "";
                document.getElementById("blog_author").innerHTML = `Written By: ${meta?.author ?? "Admin"}`;
                document.getElementById("blog_text").innerHTML = handleReplace(contentText);
            }

            window.addEventListener('load', () => display(urlParam().post));

        </script>
    </body>
</html>
